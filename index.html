<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vườn Hồng Huyền Diệu</title>
<style>
:root{box-sizing:border-box}
html,body{height:100%;margin:0;background:#120a2a;overflow:hidden;font-family:"Palatino Linotype",Georgia,serif}
canvas{display:block;touch-action:none;cursor:grab}
#snd,#rpl{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:14px;width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,214,234,.45);background:rgba(25,10,50,.45);backdrop-filter:blur(6px);color:#ffe9f3;font-size:20px;cursor:pointer;z-index:5}
#rpl{right:66px}
#ui{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#ffe9f3;text-align:center;transition:opacity 2.5s;padding:env(safe-area-inset-top,0px) 16px env(safe-area-inset-bottom,0px)}
#ui h1{font-size:clamp(28px,6vw,64px);font-weight:400;letter-spacing:.08em;margin:0;text-shadow:0 0 24px #ff6fae,0 0 60px #b36bff}
#ui p{margin:12px 0 0;opacity:.85;letter-spacing:.12em;font-size:clamp(12px,2vw,16px)}
#hint{position:fixed;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom,0px));text-align:center;color:#ffd6ea;opacity:.7;font-size:13px;letter-spacing:.1em;pointer-events:none;text-shadow:0 0 10px #000}
</style>
</head>
<body>
<button id="snd" aria-label="Bật/tắt nhạc">🔇</button><button id="rpl" aria-label="Xem lại từ đầu">↻</button>
<div id="hint">Kéo để xoay · Cuộn / chụm để phóng to · Chạm bất kỳ đâu để bật nhạc ♪</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const T=THREE;
const renderer=new T.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.outputEncoding=T.sRGBEncoding;
renderer.toneMapping=T.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.15;
document.body.prepend(renderer.domElement);
const scene=new T.Scene();
scene.fog=new T.FogExp2(0x4a2570,0.0095);
const camera=new T.PerspectiveCamera(60,innerWidth/innerHeight,0.1,600);

// glow texture
function glowTex(){const c=document.createElement('canvas');c.width=c.height=128;const x=c.getContext('2d');
const g=x.createRadialGradient(64,64,0,64,64,64);g.addColorStop(0,'rgba(255,255,255,1)');g.addColorStop(.25,'rgba(255,255,255,.55)');g.addColorStop(1,'rgba(255,255,255,0)');
x.fillStyle=g;x.fillRect(0,0,128,128);return new T.CanvasTexture(c);}
const GT=glowTex();

// sky
const sky=new T.Mesh(new T.SphereGeometry(300,32,16),new T.ShaderMaterial({side:T.BackSide,depthWrite:false,
vertexShader:'varying vec3 p;void main(){p=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
fragmentShader:'varying vec3 p;void main(){float h=clamp(normalize(p).y,0.,1.);vec3 a=vec3(1.,.55,.72);vec3 b=vec3(.42,.17,.58);vec3 c=vec3(.07,.05,.25);vec3 col=mix(a,b,smoothstep(0.,.25,h));col=mix(col,c,smoothstep(.2,.8,h));gl_FragColor=vec4(col,1.);}'}));
scene.add(sky);
// stars
{const n=700,a=new Float32Array(n*3);for(let i=0;i<n;i++){const u=Math.random()*6.28,v=Math.random()*1.3+.15,r=280;a[i*3]=Math.cos(u)*Math.cos(v)*r;a[i*3+1]=Math.sin(v)*r;a[i*3+2]=Math.sin(u)*Math.cos(v)*r;}
const g=new T.BufferGeometry();g.setAttribute('position',new T.BufferAttribute(a,3));
scene.add(new T.Points(g,new T.PointsMaterial({color:0xffffff,size:2.2,sizeAttenuation:false,map:GT,transparent:true,depthWrite:false,fog:false,blending:T.AdditiveBlending})));}
// moon
const moonGlow=new T.Sprite(new T.SpriteMaterial({map:GT,color:0xffc9ec,fog:false,transparent:true,opacity:.8,blending:T.AdditiveBlending,depthWrite:false}));
moonGlow.scale.set(150,150,1);moonGlow.position.set(-90,95,-190);scene.add(moonGlow);
const moon=new T.Mesh(new T.CircleGeometry(15,48),new T.MeshBasicMaterial({color:0xfff4fb,fog:false}));
moon.position.set(-90,95,-189);scene.add(moon);

// lights
scene.add(new T.HemisphereLight(0xb89cff,0x2a1040,.9));
const dl=new T.DirectionalLight(0xffd6f0,1.1);dl.position.set(-40,60,-60);scene.add(dl);
const pl1=new T.PointLight(0xff5fa8,2.2,30);pl1.position.set(0,4,0);scene.add(pl1);
const pl2=new T.PointLight(0x6fa8ff,1.6,35);pl2.position.set(-8,3,6);scene.add(pl2);

// ground
const ground=new T.Mesh(new T.CircleGeometry(320,64).rotateX(-Math.PI/2),new T.MeshStandardMaterial({color:0x1f5a40,roughness:1}));
scene.add(ground);
// grass
{const bg=new T.PlaneGeometry(.16,1,1,5).translate(0,.5,0);const bp=bg.attributes.position,bc=new Float32Array(bp.count*3);
for(let i=0;i<bp.count;i++){const y=bp.getY(i);bp.setXYZ(i,bp.getX(i)*(1-y*.8),y,y*y*.3);const b=.3+.8*y;bc.set([b,b,b],i*3);}
bg.setAttribute('color',new T.BufferAttribute(bc,3));bg.computeVertexNormals();
window.grassT={value:0};
const gm=new T.MeshStandardMaterial({roughness:.9,vertexColors:true,side:T.DoubleSide});
gm.onBeforeCompile=s=>{s.uniforms.uT=grassT;s.vertexShader=s.vertexShader.replace('#include <common>','#include <common>\nuniform float uT;').replace('#include <begin_vertex>','#include <begin_vertex>\nfloat w=position.y*position.y;transformed.x+=sin(uT*1.6+instanceMatrix[3].x*.35+instanceMatrix[3].z*.27)*w*.4;transformed.z+=cos(uT*1.2+instanceMatrix[3].z*.3)*w*.25;');};
const N=36000,m=new T.InstancedMesh(bg,gm,N);
const d=new T.Object3D(),c=new T.Color();
for(let i=0;i<N;i++){const r=Math.sqrt(Math.random())*85,a=Math.random()*6.28;d.position.set(Math.cos(a)*r,0,Math.sin(a)*r);
d.rotation.set((Math.random()-.5)*.5,Math.random()*6.28,(Math.random()-.5)*.5);const s=.5+Math.random()*1.0;d.scale.set(1+Math.random()*.7,s,1);d.updateMatrix();m.setMatrixAt(i,d.matrix);
c.setHSL(.27+Math.random()*.13,.6,.3+Math.random()*.28);m.setColorAt(i,c);}
scene.add(m);}

// petal geometry
function petalGeo(){const g=new T.PlaneGeometry(1,1,6,6).translate(0,.5,0);const p=g.attributes.position;const col=new Float32Array(p.count*3);
for(let i=0;i<p.count;i++){let x=p.getX(i),y=p.getY(i);x*=(.55+.75*Math.sin(Math.PI*Math.min(1,y*.9+.1)))*1.0;
const z=-y*y*.55+x*x*.9+(y>.8?(y-.8)*(y-.8)*3:0);p.setXYZ(i,x,y,z);const b=.35+.65*y;col[i*3]=col[i*3+1]=col[i*3+2]=b;}
g.setAttribute('color',new T.BufferAttribute(col,3));g.computeVertexNormals();return g;}
const PG=petalGeo();
const stemMat=new T.MeshStandardMaterial({color:0x2f7a4a,roughness:.8});
const leafGeo=new T.SphereGeometry(.18,10,6).scale(1,.12,.5);

function makeRose(hex,emi,s){
const g=new T.Group();
const mat=new T.MeshStandardMaterial({color:hex,emissive:emi,emissiveIntensity:.55,vertexColors:true,side:T.DoubleSide,roughness:.45,metalness:.05});
const rings=[[2,.17,-.12,.02],[3,.3,.05,.05],[5,.42,.4,.1],[7,.58,.75,.17],[9,.75,1.05,.25]];
rings.forEach((r,k)=>{for(let i=0;i<r[0];i++){const pv=new T.Group();pv.rotation.y=i/r[0]*6.283+k*.7;
const m=new T.Mesh(PG,mat);m.scale.setScalar(r[1]);m.position.z=r[3];m.rotation.x=r[2]+(Math.random()-.5)*.1;pv.add(m);pv.position.y=k*.03;g.add(pv);}});
g.scale.setScalar(s);
const w=new T.Group();w.add(g);
const h=1.6+Math.random()*1.4;
const stem=new T.Mesh(new T.CylinderGeometry(.035,.055,h,6).translate(0,h/2,0),stemMat);
const head=new T.Group();head.add(g);head.position.y=h;
const root=new T.Group();root.add(stem,head);
for(let i=0;i<2;i++){const l=new T.Mesh(leafGeo,stemMat);l.position.set(.2*(i?1:-1),h*(.3+i*.2),0);l.rotation.z=(i?-1:1)*.4;l.scale.setScalar(1.2);root.add(l);}
const glow=new T.Sprite(new T.SpriteMaterial({map:GT,color:emi,transparent:true,opacity:.45,blending:T.AdditiveBlending,depthWrite:false}));
glow.scale.setScalar(2.4*s*2);glow.position.y=.15*s;head.add(glow);
head.rotation.x=(Math.random()-.5)*.4;
root.userData={head,ph:Math.random()*6.28};
return root;}

const palette=[[0xff3d7f,0xff1f6b],[0xff6fae,0xff4f9a],[0xd8325f,0xc2184a],[0xb27cff,0x8a4dff],[0x6fb8ff,0x3f8bff],[0xffffff,0xffb3d9],[0xff9ad5,0xff5fc0]];
const roses=[];
const hero=makeRose(0xff2f78,0xff1060,3.2);hero.position.set(0,0,0);hero.scale.setScalar(1.4);scene.add(hero);roses.push(hero);
for(let i=0;i<90;i++){const a=i*2.399,r=3.2+Math.sqrt(i)*3+Math.random()*1.5;
const p=palette[Math.floor(Math.random()*palette.length)];
const rose=makeRose(p[0],p[1],.55+Math.random()*.5);rose.position.set(Math.cos(a)*r,0,Math.sin(a)*r);rose.rotation.y=Math.random()*6.28;scene.add(rose);roses.push(rose);}

// far rose field (instanced)
{const FR=1400,pal=palette.map(p=>new T.Color(p[0]));
const bud=new T.InstancedMesh(new T.IcosahedronGeometry(.34,1).scale(1,.85,1),new T.MeshStandardMaterial({emissive:0x5a1838,emissiveIntensity:.9,roughness:.5}),FR);
const st=new T.InstancedMesh(new T.CylinderGeometry(.03,.04,1,5).translate(0,.5,0),stemMat,FR);
const d=new T.Object3D(),gp=new Float32Array(FR*3),gc=new Float32Array(FR*3);
for(let i=0;i<FR;i++){const r=32+Math.sqrt(Math.random())*85,a=Math.random()*6.283,h=.9+Math.random()*1.1,s=.6+Math.random()*.7,x=Math.cos(a)*r,z=Math.sin(a)*r;
d.position.set(x,0,z);d.scale.set(1,h,1);d.updateMatrix();st.setMatrixAt(i,d.matrix);
d.position.set(x,h,z);d.scale.setScalar(s);d.updateMatrix();bud.setMatrixAt(i,d.matrix);
const c=pal[Math.floor(Math.random()*pal.length)];bud.setColorAt(i,c);gp.set([x,h+.2,z],i*3);gc.set([c.r,c.g,c.b],i*3);}
scene.add(st,bud);
const g=new T.BufferGeometry();g.setAttribute('position',new T.BufferAttribute(gp,3));g.setAttribute('color',new T.BufferAttribute(gc,3));
scene.add(new T.Points(g,new T.PointsMaterial({size:2.6,map:GT,vertexColors:true,transparent:true,opacity:.35,depthWrite:false,blending:T.AdditiveBlending})));}
// distant hills
for(let i=0;i<16;i++){const a=i/16*6.283+Math.random()*.3,r=165+Math.random()*50;
const h=new T.Mesh(new T.SphereGeometry(1,24,12),new T.MeshBasicMaterial({color:new T.Color().setHSL(.76,.45,.1+Math.random()*.06)}));
h.scale.set(55+Math.random()*45,14+Math.random()*18,40);h.position.set(Math.cos(a)*r,-3,Math.sin(a)*r);h.rotation.y=-a;scene.add(h);}
// fireflies
const FN=1100,fp=new Float32Array(FN*3),fc=new Float32Array(FN*3),fd=[];
for(let i=0;i<FN;i++){const a=Math.random()*6.28,r=Math.random()*75;fp[i*3]=Math.cos(a)*r;fp[i*3+1]=.3+Math.random()*9;fp[i*3+2]=Math.sin(a)*r;
const c=new T.Color().setHSL(.85+Math.random()*.15,1,.7);if(Math.random()<.3)c.setHSL(.58,1,.75);fc.set([c.r,c.g,c.b],i*3);fd.push(Math.random()*6.28);}
const fg=new T.BufferGeometry();fg.setAttribute('position',new T.BufferAttribute(fp,3));fg.setAttribute('color',new T.BufferAttribute(fc,3));
scene.add(new T.Points(fg,new T.PointsMaterial({size:.45,map:GT,vertexColors:true,transparent:true,depthWrite:false,blending:T.AdditiveBlending})));

// falling petals
const fm=new T.MeshStandardMaterial({color:0xff8fc4,emissive:0xff4f9a,emissiveIntensity:.6,vertexColors:true,side:T.DoubleSide});
const fall=[];
for(let i=0;i<90;i++){const m=new T.Mesh(PG,fm);m.scale.setScalar(.22+Math.random()*.15);
m.position.set((Math.random()-.5)*40,Math.random()*14,(Math.random()-.5)*40);
m.userData={v:.35+Math.random()*.5,s:Math.random()*2+1,o:Math.random()*6.28,rx:Math.random()*2,ry:Math.random()*2};scene.add(m);fall.push(m);}

// ===== INTRO: cánh hoa rơi rồi kết thành bông hồng lớn =====
const intro={done:false,z:0},eo=x=>1-Math.pow(1-x,3),cl=x=>Math.min(1,Math.max(0,x));
const HY=hero.userData.head.position.y*1.4,hHead=hero.userData.head,hStem=hero.children[0],hLeaves=hero.children.slice(1,3),hGlow=hHead.children[1],gS=hGlow.scale.x;
const ip=hHead.children[0].children.map((pv,i,a)=>({pv,p1:pv.position.clone(),q1:pv.quaternion.clone(),
p0:new T.Vector3((Math.random()-.5)*6,3+Math.random()*4,(Math.random()-.5)*6),
q0:new T.Quaternion().setFromEuler(new T.Euler(Math.random()*6,Math.random()*6,Math.random()*6)),
d:Math.random()*2.5,ph:Math.random()*6.28}));
const ex=[];for(let i=0;i<140;i++){const m=new T.Mesh(PG,fm),a=Math.random()*6.283,r=3+Math.random()*13;m.scale.setScalar(.28+Math.random()*.25);
m.position.set(Math.cos(a)*r,10+Math.random()*16,Math.sin(a)*r);m.userData={a,r,y:m.position.y,v:.9+Math.random()*1.1,o:Math.random()*6.28,s:m.scale.x,rx:Math.random()*2+.5,ry:Math.random()*2+.5};
m.rotation.set(Math.random()*6,Math.random()*6,0);scene.add(m);ex.push(m);}
roses.forEach((r,i)=>{if(i>0){r.scale.setScalar(.001);r.userData.bd=6.4+Math.hypot(r.position.x,r.position.z)*.07;}});
function introUpdate(t){
for(const o of ip){const e=eo(cl((t-o.d)/3.8)),sw=1-e,p=o.pv.position;p.copy(o.p0).lerp(o.p1,e);
const an=sw*2.4,c=Math.cos(an),s=Math.sin(an),x=p.x,z=p.z;p.x=x*c-z*s+Math.sin(t*2.5+o.ph)*.14*sw;p.z=x*s+z*c;p.y+=Math.cos(t*2+o.ph)*.12*sw;
o.pv.quaternion.slerpQuaternions(o.q0,o.q1,e);}
hStem.scale.y=Math.max(.001,eo(cl((t-3.5)/3)));
const el=Math.max(.001,1.2*eo(cl((t-5.5)/1.5)));hLeaves.forEach(l=>l.scale.setScalar(el));
hGlow.scale.setScalar(Math.max(.001,gS*eo(cl((t-4.5)/2.5))));
for(const m of ex){const u=m.userData,k=eo(cl((t-3.8)/3)),a=u.a+t*.18+Math.sin(t+u.o)*.2;
m.position.set(Math.cos(a)*u.r+Math.sin(t*1.3+u.o)*.6,u.y-u.v*t*Math.min(1,t),Math.sin(a)*u.r);
if(t>3.8){m.position.x*=1-k;m.position.z*=1-k;m.position.y+=(HY-m.position.y)*k;}
m.scale.setScalar(Math.max(.001,u.s*(1-k)));m.rotation.x+=u.rx*.02;m.rotation.y+=u.ry*.02;m.visible=k<1;}
for(let i=1;i<roses.length;i++){const r=roses[i];r.scale.setScalar(Math.max(.001,eo(cl((t-r.userData.bd)/1.3))));}
if(t>6.8&&!intro.z){intro.z=1;tDist=26;}
if(t>11.5){intro.done=true;ex.forEach(m=>m.visible=false);}}
// ===== INTRO v2: cánh hoa xếp thành chữ -> tan ra thành bông hồng =====
ex.forEach(m=>scene.remove(m));
const TH=.6,tx=[];
{const cv2=document.createElement('canvas');cv2.width=1024;cv2.height=512;const c2=cv2.getContext('2d');
c2.fillStyle='#fff';c2.textAlign='center';c2.textBaseline='middle';
c2.font='bold 190px Georgia,serif';c2.fillText('Chúc mừng',512,135);
c2.font='bold 250px Georgia,serif';c2.fillText('20-10',512,370);
const id=c2.getImageData(0,0,1024,512).data,cand=[];
for(let y=0;y<512;y+=5)for(let x=0;x<1024;x+=5)if(id[(y*1024+x)*4+3]>128)cand.push([x,y]);
cand.sort(()=>Math.random()-.5);
const visW=2*13*Math.tan(Math.PI/6)*camera.aspect,W=Math.min(16,visW*.9),sc=W/1024,H=512*sc,yc=H/2+1.8,rx=Math.cos(TH),rz=-Math.sin(TH),pk=Math.max(.55,Math.min(1,W/16));
cand.slice(0,560).forEach(p=>{const lx=(p[0]-512)*sc,ly=(256-p[1])*sc,m=new T.Mesh(PG,fm),s=(.3+Math.random()*.12)*pk;
m.scale.setScalar(s);const a=Math.random()*6.283,r=6+Math.random()*16,z0=Math.random()*6.283;
m.userData={tx:lx*rx,ty:ly+yc,tz:lx*rz,a0:a,r0:r,y0:16+Math.random()*14,d:Math.random()*2,ph:Math.random()*6.28,s};
m.rotation.set((Math.random()-.5)*.8,TH+(Math.random()-.5)*.6,z0);scene.add(m);tx.push(m);});}
roses.forEach(r=>{if(r.userData.bd)r.userData.bd+=2;});
function introUpdate2(t){
for(const m of tx){const u=m.userData,e=eo(cl((t-u.d)/2.2)),sw=1-e,sx=Math.cos(u.a0)*u.r0,sz=Math.sin(u.a0)*u.r0;
let x=sx+(u.tx-sx)*e,y=u.y0+(u.ty-u.y0)*e,z=sz+(u.tz-sz)*e;
const an=sw*2.2,c=Math.cos(an),s=Math.sin(an),x2=x*c-z*s,z2=x*s+z*c;x=x2+Math.sin(t*2.5+u.ph)*.25*sw;z=z2;y+=Math.sin(t*2+u.ph)*.03*e;
const k=eo(cl((t-5-u.d*.5)/2.2));
if(k>0){const a2=k*3.5,c3=Math.cos(a2),s3=Math.sin(a2),x3=x*c3-z*s3,z3=x*s3+z*c3;x=x3*(1-k);z=z3*(1-k);y+=(HY-y)*k;m.rotation.x+=.1*k;}
m.position.set(x,y,z);m.scale.setScalar(Math.max(.001,u.s*(1-k)));m.visible=k<1;}
hero.visible=t>4.8;
for(const o of ip){const e=eo(cl((t-4.8-o.d*.4)/2.4)),sw=1-e,p=o.pv.position;p.copy(o.p0).lerp(o.p1,e);
const an=sw*2.4,c=Math.cos(an),s=Math.sin(an),x=p.x,z=p.z;p.x=x*c-z*s+Math.sin(t*2.5+o.ph)*.14*sw;p.z=x*s+z*c;p.y+=Math.cos(t*2+o.ph)*.12*sw;
o.pv.quaternion.slerpQuaternions(o.q0,o.q1,e);}
hStem.scale.y=Math.max(.001,eo(cl((t-6.3)/2)));
const el=Math.max(.001,1.2*eo(cl((t-7.6)/1.2)));hLeaves.forEach(l=>l.scale.setScalar(el));
hGlow.scale.setScalar(Math.max(.001,gS*eo(cl((t-6.8)/2))));
for(let i=1;i<roses.length;i++){const r=roses[i];r.scale.setScalar(Math.max(.001,eo(cl((t-r.userData.bd)/1.3))));}
if(t>7.8&&!intro.z){intro.z=1;tDist=26;}
if(t>14){intro.done=true;tx.forEach(m=>m.visible=false);}}
// ===== INTRO v3: chữ rõ nét 8s -> lốc xoáy cánh hoa -> bông hồng =====
tx.forEach(m=>scene.remove(m));
roses.forEach(r=>{if(r.userData.bd)r.userData.bd+=.8;});
const tm=new T.MeshStandardMaterial({color:0xffffff,emissive:0xff8fc0,emissiveIntensity:1.3,vertexColors:true,side:T.DoubleSide,roughness:.5});
const tD=[],dm=new T.Object3D();let tI;
{const cv3=document.createElement('canvas');cv3.width=1024;cv3.height=512;const c3=cv3.getContext('2d');
c3.fillStyle='#fff';c3.strokeStyle='#fff';c3.lineWidth=1;c3.letterSpacing='12px';c3.textAlign='center';c3.textBaseline='middle';
const fit=(txt,sz,mw,y)=>{let s=sz;do{c3.font='bold '+s+'px Arial,Helvetica,sans-serif';s-=4;}while(c3.measureText(txt).width>mw&&s>40);c3.fillText(txt,512,y);c3.strokeText(txt,512,y);};
fit('Chúc mừng',200,900,150);fit('20-10',300,700,385);
const d3=c3.getImageData(0,0,1024,512).data,cand=[];
for(let y=0;y<512;y+=7)for(let x=0;x<1024;x+=7)if(d3[(y*1024+x)*4+3]>128)cand.push([x,y]);
const pts=cand;
const visW=2*13*Math.tan(Math.PI/6)*camera.aspect,W=Math.min(17,visW*.8),sc=W/1024,H=512*sc,yc=H/2+1.6,pk=Math.max(.3,W/17),rx=Math.cos(TH),rz=-Math.sin(TH);
tI=new T.InstancedMesh(PG,tm,pts.length);tI.frustumCulled=false;const col=new T.Color();
pts.forEach((p,i)=>{const lx=(p[0]-512)*sc,ly=(256-p[1])*sc,X=lx*rx,Y=ly+yc,Z=lx*rz,a=Math.random()*6.283;
tD.push({X,Y,Z,rho:Math.hypot(X,Z),phi:Math.atan2(Z,X),a0:a,r0:6+Math.random()*16,y0:16+Math.random()*14,d:Math.random()*1,ph:Math.random()*6.28,s:(.09+Math.random()*.04)*pk,rx0:(Math.random()-.5)*.2,ry0:TH+(Math.random()-.5)*.15,rz0:Math.random()*6.283});
col.setHSL(.93+Math.random()*.06,1,.78+Math.random()*.17);tI.setColorAt(i,col);});
scene.add(tI);
const bc=document.createElement('canvas');bc.width=bc.height=256;const bx=bc.getContext('2d'),bgr=bx.createRadialGradient(128,128,10,128,128,128);
bgr.addColorStop(0,'rgba(20,6,40,.8)');bgr.addColorStop(.6,'rgba(20,6,40,.5)');bgr.addColorStop(1,'rgba(20,6,40,0)');bx.fillStyle=bgr;bx.fillRect(0,0,256,256);
window.tPanel=new T.Mesh(new T.PlaneGeometry(W*1.45,H*1.7),new T.MeshBasicMaterial({map:new T.CanvasTexture(bc),transparent:true,depthWrite:false,fog:false,opacity:0}));
tPanel.position.set(-1.2*Math.sin(TH),yc,-1.2*Math.cos(TH));tPanel.rotation.y=TH;tPanel.renderOrder=-1;scene.add(tPanel);}
function introUpdate3(t){
for(let i=0;i<tD.length;i++){const u=tD[i],e=eo(cl((t-u.d)/1.6)),sw=1-e,sx=Math.cos(u.a0)*u.r0,sz=Math.sin(u.a0)*u.r0;
let x=sx+(u.X-sx)*e,y=u.y0+(u.Y-u.y0)*e,z=sz+(u.Z-sz)*e;
const an=sw*2.2,c=Math.cos(an),s=Math.sin(an),x2=x*c-z*s,z2=x*s+z*c;x=x2+Math.sin(t*2.5+u.ph)*.25*sw;z=z2;
const k=cl((t-5-u.d*.3)/3);let rxx=u.rx0,ryy=u.ry0,rzz=u.rz0,ss=u.s;
if(k>0){const kp=k*k*(3-2*k),ang=u.phi+16*Math.pow(k,1.15),rho=u.rho*Math.pow(1-kp,1.1)*(1+.5*Math.sin(Math.PI*kp));
x=rho*Math.cos(ang);z=rho*Math.sin(ang);y=u.Y+(HY-u.Y)*kp+Math.sin(ang*2)*.15;
rxx+=k*1.2;ryy-=ang-u.phi;rzz+=k*6;if(k>.85)ss*=Math.max(0,1-(k-.85)/.15);}
dm.position.set(x,y,z);dm.rotation.set(rxx,ryy,rzz);dm.scale.setScalar(Math.max(.0001,ss));dm.updateMatrix();tI.setMatrixAt(i,dm.matrix);}
tI.instanceMatrix.needsUpdate=true;tPanel.material.opacity=cl(t/1.5)*(1-cl((t-5)/1.5));tPanel.visible=tPanel.material.opacity>.01;
hero.visible=t>6.2;
for(const o of ip){const e=eo(cl((t-6.2-o.d*.3)/1.8)),sw=1-e,p=o.pv.position;p.copy(o.p0).lerp(o.p1,e);
const an=sw*2.4,c=Math.cos(an),s=Math.sin(an),x=p.x,z=p.z;p.x=x*c-z*s+Math.sin(t*2.5+o.ph)*.14*sw;p.z=x*s+z*c;p.y+=Math.cos(t*2+o.ph)*.12*sw;
o.pv.quaternion.slerpQuaternions(o.q0,o.q1,e);}
hStem.scale.y=Math.max(.001,eo(cl((t-7.2)/1.8)));
const el=Math.max(.001,1.2*eo(cl((t-8.5)/1)));hLeaves.forEach(l=>l.scale.setScalar(el));
hGlow.scale.setScalar(Math.max(.001,gS*eo(cl((t-7.5)/2))));
for(let i=1;i<roses.length;i++){const r=roses[i];r.scale.setScalar(Math.max(.001,eo(cl((t-r.userData.bd)/1.3))));}
if(t>9&&!intro.z){intro.z=1;tDist=26;}
if(t>15){intro.done=true;tI.visible=false;}}
introUpdate3(0);
// camera control
let th=.6,ph=1.3,dist=13,tTh=th,tPh=ph,tDist=dist,drag=false,lx=0,ly=0,idle=0;
const cv=renderer.domElement,pts=new Map();let pd=0;
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);pts.set(e.pointerId,e);drag=true;lx=e.clientX;ly=e.clientY;idle=0;cv.style.cursor='grabbing';});
cv.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId))return;pts.set(e.pointerId,e);
if(pts.size===2){const [a,b]=[...pts.values()];const d=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);if(pd)tDist=Math.min(70,Math.max(5,tDist*pd/d));pd=d;return;}
tTh-=(e.clientX-lx)*.006;tPh=Math.min(1.5,Math.max(.35,tPh-(e.clientY-ly)*.005));lx=e.clientX;ly=e.clientY;idle=0;});
const up=e=>{pts.delete(e.pointerId);pd=0;if(!pts.size){drag=false;cv.style.cursor='grab';}};
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
cv.addEventListener('wheel',e=>{e.preventDefault();tDist=Math.min(70,Math.max(5,tDist*(1+e.deltaY*.001)));},{passive:false});
addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();});
// ===== NHẠC NỀN (tự tạo bằng Web Audio) =====
let AC,master,started=false,muted=false;
const sb=document.getElementById('snd'),hintEl=document.getElementById('hint');
function startMusic(){
started=true;AC=new (window.AudioContext||window.webkitAudioContext)();AC.resume();
master=AC.createGain();master.gain.value=0;master.connect(AC.destination);master.gain.linearRampToValueAtTime(.55,AC.currentTime+5);
const len=AC.sampleRate*3,ir=AC.createBuffer(2,len,AC.sampleRate);
for(let c=0;c<2;c++){const d=ir.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.5);}
const rev=AC.createConvolver();rev.buffer=ir;const rg=AC.createGain();rg.gain.value=.7;rev.connect(rg);rg.connect(master);
const dry=AC.createGain();dry.gain.value=.7;dry.connect(master);
const bus=AC.createGain();bus.connect(dry);bus.connect(rev);
const dl=AC.createDelay();dl.delayTime.value=.45;const fb=AC.createGain();fb.gain.value=.35;bus.connect(dl);dl.connect(fb);fb.connect(dl);dl.connect(rev);
const hz=n=>440*Math.pow(2,(n-69)/12);
const chords=[[50,57,62,66],[47,59,62,66],[43,55,59,62],[45,57,61,64]];
function note(f,t,dur,type,vol,att){const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;
g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+att);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(bus);o.start(t);o.stop(t+dur+.1);}
function violin(m,t,dur){const f=hz(m),o1=AC.createOscillator(),o2=AC.createOscillator(),lfo=AC.createOscillator(),lg=AC.createGain(),flt=AC.createBiquadFilter(),body=AC.createBiquadFilter(),g=AC.createGain();
o1.type=o2.type='sawtooth';o1.frequency.value=f;o2.frequency.value=f;o1.detune.value=-5;o2.detune.value=7;
lfo.frequency.value=5.3;lg.gain.setValueAtTime(0,t);lg.gain.linearRampToValueAtTime(f*.008,t+.7);lfo.connect(lg);lg.connect(o1.frequency);lg.connect(o2.frequency);
flt.type='lowpass';flt.Q.value=.8;flt.frequency.setValueAtTime(900,t);flt.frequency.linearRampToValueAtTime(2600,t+.45);
body.type='peaking';body.frequency.value=900;body.gain.value=6;
g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.055,t+.35);g.gain.setValueAtTime(.055,t+Math.max(.4,dur-.15));g.gain.linearRampToValueAtTime(.0001,t+dur+.4);
o1.connect(flt);o2.connect(flt);flt.connect(body);body.connect(g);g.connect(bus);
[o1,o2,lfo].forEach(o=>{o.start(t);o.stop(t+dur+.5);});}
const VB=.8,PH=[[[78,0,2.5],[81,2.5,1.5],[86,4,3],[85,7,1],[83,8,2]],[[83,0,3],[81,3,1],[78,4,2],[81,6,1.5],[83,7.5,2.5]],[[79,0,2],[83,2,2],[86,4,2.5],[83,6.5,1],[81,7.5,.5],[79,8,2]],[[85,0,2],[83,2,1],[81,3,2],[76,5,1.5],[81,6.5,1.5],[85,8,2]]];
let ci=0,next=AC.currentTime+.2;
const sched=()=>{while(next<AC.currentTime+2){const ch=chords[ci++%4];
ch.forEach(n=>note(hz(n),next,9,'triangle',.035,2.5));
note(hz(ch[0]-12),next,8,'sine',.09,1.5);
const oct=(Math.floor((ci-1)/4)%2)?-12:0;PH[(ci-1)%4].forEach(p=>violin(p[0]+oct,next+p[1]*VB,p[2]*VB));
next+=8;}};
sched();setInterval(sched,1000);}
let t0=0;const rb=document.getElementById('rpl');
rb.addEventListener('click',()=>{t0=clock.getElapsedTime();intro.done=false;intro.z=0;tI.visible=true;th=tTh=.6;ph=tPh=1.3;dist=tDist=13;idle=0;});
function setIcon(){sb.textContent=(!started||muted)?'🔇':'🔊';}
function firstGo(e){if(started||e.target===sb)return;startMusic();setIcon();hintEl.style.opacity=0;}
['pointerup','touchend','keydown'].forEach(n=>addEventListener(n,firstGo));
sb.addEventListener('click',()=>{if(!started){startMusic();hintEl.style.opacity=0;}else{muted=!muted;master.gain.cancelScheduledValues(AC.currentTime);master.gain.linearRampToValueAtTime(muted?0:.55,AC.currentTime+.8);if(!muted)AC.resume();}setIcon();});

const clock=new T.Clock();
function tick(){const t=clock.getElapsedTime(),dt=Math.min(clock.getDelta(),.05)||.016;
if(!intro.done)introUpdate3(t-t0);grassT.value=t;idle+=.016;if(!drag&&idle>2&&t-t0>5)tTh+=.0018;
th+=(tTh-th)*.08;ph+=(tPh-ph)*.08;dist+=(tDist-dist)*.08;
camera.position.set(Math.sin(th)*Math.sin(ph)*dist,3+Math.cos(ph)*dist,Math.cos(th)*Math.sin(ph)*dist);camera.lookAt(0,3,0);
roses.forEach((r,i)=>{const u=r.userData;u.head.rotation.z=Math.sin(t*1.1+u.ph)*.07;u.head.rotation.x+=Math.sin(t*.8+u.ph)*.0008;
const s=1+Math.sin(t*1.6+u.ph)*.025;u.head.children[0].scale.setScalar(u.head.children[0].scale.x*0+ (i===0?3.2:u.head.children[0].scale.x)*1);});
hero.userData.head.children[1].material.opacity=.4+Math.sin(t*2)*.12;
pl1.intensity=2.2+Math.sin(t*2)*.6;
const p=fg.attributes.position;
for(let i=0;i<FN;i++){const k=fd[i];p.array[i*3]+=Math.sin(t*.6+k)*.004;p.array[i*3+1]+=Math.cos(t*.8+k*2)*.005;p.array[i*3+2]+=Math.cos(t*.5+k)*.004;}
p.needsUpdate=true;
fall.forEach(m=>{const u=m.userData;m.position.y-=u.v*.016;m.position.x+=Math.sin(t*.8+u.o)*.012+.006;m.position.z+=Math.cos(t*.6+u.o)*.01;
m.rotation.x+=u.rx*.02;m.rotation.y+=u.ry*.02;if(m.position.y<0){m.position.y=14;m.position.x=(Math.random()-.5)*40;m.position.z=(Math.random()-.5)*40;}});
renderer.render(scene,camera);requestAnimationFrame(tick);}
tick();
</script>
